<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vaxelis - Platformer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14181f;
                 color: #cdd6e3; font: 14px/1.4 system-ui, sans-serif; }
    /* Sizing the canvas via CSS puts SDL's Emscripten backend in external-size
       mode: it keeps the framebuffer at CSS size x devicePixelRatio and sends
       resize events whenever the browser window changes. */
    canvas { display: block; width: 100vw; height: 100vh; background: #000;
             image-rendering: pixelated; }
    #status { position: fixed; top: 8px; right: 12px; opacity: .8; pointer-events: none; }
  </style>
</head>
<body>
  <div id="status">loading…</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    var statusEl = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (t) { if (statusEl) statusEl.textContent = t || ''; },
      print: function () { console.log.apply(console, arguments); },
      printErr: function () { console.error.apply(console, arguments); },
    };
    Module.setStatus('Downloading…');
  </script>
  {{{ SCRIPT }}}
</body>
</html>
