name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Supersede an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain + SDL deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14 pkg-config \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev libwayland-dev libdecor-0-dev
      - name: Configure release build
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DVAXELIS_BUILD_TESTS=OFF
      - name: Build release artifacts
        run: cmake --build build/release --parallel
      - name: Package artifacts
        # runtime/ holds the exe plus the mirrored assets; bundle libSDL3 with it.
        run: |
          cp build/release/third_party/SDL/libSDL3.so* build/release/runtime/
          tar -czf vaxelis-${GITHUB_REF_NAME}-linux-x86_64.tar.gz -C build/release/runtime .
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: vaxelis-${{ github.ref_name }}-linux-x86_64.tar.gz