name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain + SDL deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev libwayland-dev libdecor-0-dev
      - name: Configure release build
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCPP_PACKAGE_BOILERPLATE_BUILD_TESTS=OFF -DCPP_PACKAGE_BOILERPLATE_BUILD_BENCHMARKS=OFF -DCPP_PACKAGE_BOILERPLATE_BUILD_DOCS=OFF
      - name: Build release artifacts
        run: cmake --build build/release --parallel
      - name: Package artifacts
        run: tar -czf cpp-package-boilerplate-${GITHUB_REF_NAME}.tar.gz -C build/release .
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: cpp-package-boilerplate-${{ github.ref_name }}.tar.gz