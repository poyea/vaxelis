name: docs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; queued runs wait rather than cancel a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install docs toolchain + SDL deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake doxygen graphviz ninja-build g++-14 pkg-config \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev libwayland-dev libdecor-0-dev
      - name: Configure docs
        # Tests off so configure doesn't fetch googletest; only the docs
        # target is built, so nothing else gets compiled. CC/CXX pinned to
        # gcc-14 since the C++26 floor rejects ubuntu-24.04's default gcc-13.
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build/docs -G Ninja -DVAXELIS_BUILD_TESTS=OFF -DVAXELIS_BUILD_DOCS=ON
      - name: Build docs
        run: cmake --build build/docs --target docs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/docs/site/html

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

