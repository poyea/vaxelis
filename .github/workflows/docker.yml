name: docker

on:
  workflow_dispatch:
  # Push trigger disabled: Dockerfile is boilerplate (wrong exe path, stale
  # flags). Re-enable after the Dockerfile is rewritten for the runtime.

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build image
        run: docker build -t cpp-package-boilerplate:latest .
