name: bench

on:
  push:
    branches: [main]
  workflow_dispatch:

# Supersede an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecs-bench:
    # Informational only. A shared runner's timings are far too noisy to gate a
    # merge on, so this job never fails the commit it reports about.
    continue-on-error: true
    runs-on: ubuntu-24.04
    # contents: write only so the opt-in step below can comment on the commit.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain + SDL deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build g++-14 pkg-config \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev libwayland-dev libdecor-0-dev
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        # Release matters: the default configure is unoptimised, which would
        # measure the debug allocator more than the storage layout.
        run: >
          cmake -S . -B build/bench -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVAXELIS_BUILD_TESTS=OFF
          -DVAXELIS_BUILD_RUNTIME=OFF
          -DVAXELIS_BUILD_EXAMPLES=OFF
          -DVAXELIS_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build/bench --target vaxelis_ecs_bench
      - name: Run
        run: ./build/bench/benchmarks/vaxelis_ecs_bench | tee bench.txt
      - name: Summarise
        run: |
          {
            echo "## ECS benchmark"
            echo ""
            echo "Archetype world vs entt sparse sets, same work on both."
            echo "Ratio below 1.00 means the archetype path was faster."
            echo ""
            cat bench.txt
          } >> "$GITHUB_STEP_SUMMARY"
      # Opt-in: the table lands on the commit only when its message carries
      # [#run-bench], so the numbers are readable without a token on the commits
      # you care about and every other push stays quiet.
      - name: Attach results to the commit
        if: contains(github.event.head_commit.message, '[#run-bench]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEADER='### ECS benchmark\n\nRatio below 1.00 means the archetype path was faster.\n\n'
          jq -Rs --arg header "$(printf "$HEADER")" '{body: ($header + .)}' bench.txt > payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -d @payload.json > /dev/null
